name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-drafter:
    name: Draft and publish release
    if: >-
      !startsWith(github.event.head_commit.message,
      'ci(release): sync manifest version')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Draft release
        id: draft
        uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync manifest version into release tag
        id: sync
        env:
          DRAFT_TAG: ${{ steps.draft.outputs.tag_name }}
        run: |
          version="${DRAFT_TAG#v}"
          jq --arg version "$version" '.version = $version' \
            custom_components/ecoflow_mqtt/manifest.json > manifest.json.tmp
          mv manifest.json.tmp custom_components/ecoflow_mqtt/manifest.json

          if git diff --quiet -- custom_components/ecoflow_mqtt/manifest.json; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/ecoflow_mqtt/manifest.json
          git commit -m "ci(release): sync manifest version to $version"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push release tag
        env:
          DRAFT_TAG: ${{ steps.draft.outputs.tag_name }}
          RELEASE_SHA: ${{ steps.sync.outputs.sha }}
        run: git push origin "$RELEASE_SHA:refs/tags/$DRAFT_TAG"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release edit "${{ steps.draft.outputs.tag_name }}" \
            --repo "$GH_REPO" --target "${{ steps.sync.outputs.sha }}" --draft=false

      - name: Synchronize manifest on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DRAFT_TAG: ${{ steps.draft.outputs.tag_name }}
        run: |
          version="${DRAFT_TAG#v}"
          branch="ci/release-manifest-${version}-${GITHUB_RUN_ID}"

          git fetch origin main
          git switch --create "$branch" origin/main
          jq --arg version "$version" '.version = $version' \
            custom_components/ecoflow_mqtt/manifest.json > manifest.json.tmp
          mv manifest.json.tmp custom_components/ecoflow_mqtt/manifest.json

          if git diff --quiet -- custom_components/ecoflow_mqtt/manifest.json; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/ecoflow_mqtt/manifest.json
          git commit -m "ci(release): sync manifest version to $version"
          git push origin "HEAD:$branch"

          pr_url="$(gh pr list --repo "$GH_REPO" --state open --head "$branch" \
            --json url --jq '.[0].url')"
          if [ -z "$pr_url" ]; then
            pr_url="$(gh pr create --repo "$GH_REPO" --base main --head "$branch" \
              --title "ci(release): sync manifest version to $version" \
              --body "Synchronize custom_components/ecoflow_mqtt/manifest.json with release $DRAFT_TAG.")"
          fi
          if ! gh pr merge "$pr_url" --repo "$GH_REPO" --squash --auto --delete-branch 2>/tmp/merge-error.log; then
            # "Pull request is in clean status" means there's nothing for
            # auto-merge to wait on (no required checks on this branch) and
            # GitHub refuses to arm auto-merge for an already-mergeable PR —
            # fall back to a direct merge in that case.
            if grep -q "clean status" /tmp/merge-error.log; then
              gh pr merge "$pr_url" --repo "$GH_REPO" --squash --delete-branch
            else
              cat /tmp/merge-error.log >&2
              exit 1
            fi
          fi
